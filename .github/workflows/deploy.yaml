name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 21

      - name: Clone Rin repository
        uses: actions/checkout@v4
        with:
          path: Rin

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: |
          cd Rin/
          bun i

      - name: Deploy Worker and run D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DB_NAME: ${{ vars.DB_NAME }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          S3_FOLDER: ${{ vars.S3_FOLDER }}
        run: |
          cd Rin/
          bun scripts/migrator.ts

      - name: Build frontend
        env:
          API_URL: ${{ vars.API_URL }}
          AVATAR: ${{ vars.AVATAR }}
          NAME: ${{ vars.NAME }}
          DESCRIPTION: ${{ vars.DESCRIPTION }}
          PAGE_SIZE: ${{ vars.PAGE_SIZE }}
        run: |
          cd Rin/
          bun b

      - name: Deploy frontend to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd Rin/
          bunx wrangler pages deploy client/dist --project-name=${{ vars.PAGES_PROJECT }} --branch=main
